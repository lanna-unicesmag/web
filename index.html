<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=2560">
  <title>LANNA — Inicio</title>
  <link rel="icon" href="logo/isotipo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #121312;
      --cream: #F5F0E8;
      --gold: #E5C272;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark);
      color: var(--cream);
      font-family: 'Outfit', sans-serif;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .left-col {
      flex: 1;
      height: 100vh;
      background-color: var(--dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      box-sizing: border-box;
    }

    .left-col video {
      width: 100%;
      max-width: 400px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .right-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--dark);
      border-left: 1px solid rgba(255,255,255,0.05);
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 100%;
      max-width: 220px;
      margin-bottom: 3.5rem;
      filter: brightness(0) saturate(100%) invert(79%) sepia(35%) saturate(600%) hue-rotate(5deg) brightness(105%);
      display: block;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      width: 100%;
    }

    .btn-container {
      position: relative;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.2rem;
      background-color: transparent;
      border: 1px solid var(--gold);
      color: var(--cream);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      box-sizing: border-box;
      text-align: center;
    }

    .btn:hover, .btn.active {
      background-color: var(--gold);
      color: var(--dark);
    }

    footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: rgba(245, 240, 232, 0.5);
      text-align: center;
      width: 100%;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }
      .left-col {
        height: 50vh;
        padding: 2rem;
      }
      .right-col {
        height: 50vh;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,0.05);
      }
    }
  </style>
</head>
<body>

  <div class="left-col">
    <!-- El video ahora tiene controles, sonido, y su relación de aspecto original -->
    <video src="SPOT - LANNA.mp4" controls playsinline></video>
  </div>

  <div class="right-col">
    <div class="container">
      <img src="logo/logotipo.svg" alt="LANNA" class="logo">
      
      <div class="menu">
        <div class="btn-container">
          <a href="presentacion_proyecto.html" class="btn">PRESENTACIÓN</a>
        </div>

        <div class="btn-container">
          <a href="brochure.html" class="btn">BROCHURE</a>
        </div>

        <div class="btn-container">
          <a href="fichas_interactivas.html" class="btn">FICHAS TÉCNICAS</a>
        </div>

        <div class="btn-container">
          <a href="resultados.html" class="btn">RESULTADOS</a>
        </div>
      </div>
    </div>

    <footer>
      LANNA &copy; 2026
    </footer>
  </div>

</body>
</html>
