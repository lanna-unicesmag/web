<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LANNA — Inicio</title>
  <link rel="icon" href="logo/isotipo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #121312;
      --cream: #F5F0E8;
      --gold: #E5C272;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--dark);
      color: var(--cream);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 400px; /* Limits the width of the menu to keep buttons a consistent size */
      padding: 2rem;
      box-sizing: border-box;
    }

    .logo {
      max-width: 220px;
      margin-bottom: 3.5rem;
      filter: brightness(0) saturate(100%) invert(79%) sepia(35%) saturate(600%) hue-rotate(5deg) brightness(105%);
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      width: 100%;
    }

    .btn-container {
      position: relative;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 1.2rem;
      background-color: transparent;
      border: 1px solid var(--gold);
      color: var(--cream);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: var(--gold);
      color: var(--dark);
    }

    .dropdown {
      display: none;
      flex-direction: row;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1rem;
      width: 100%;
    }

    .dropdown.active {
      display: flex;
    }

    .btn-sub {
      flex: 1;
      padding: 1rem;
      border: 1px solid var(--cream);
      color: var(--cream);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
      text-align: center;
      box-sizing: border-box;
    }

    .btn-sub:hover {
      background-color: var(--cream);
      color: var(--dark);
    }

    footer {
      position: absolute;
      bottom: 2rem;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: rgba(245, 240, 232, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="logo/logotipo.svg" alt="LANNA" class="logo">
    
    <div class="menu">
      <div class="btn-container">
        <a href="pitch.html" class="btn">PITCH</a>
      </div>

      <div class="btn-container">
        <a href="moodboard.png" target="_blank" class="btn">MOODBOARD</a>
      </div>

      <div class="btn-container">
        <button class="btn" id="btn-brief">BRIEF</button>
        <div class="dropdown" id="dropdown-brief">
          <a href="brief.pdf" target="_blank" class="btn-sub">PDF</a>
          <a href="brief.html" class="btn-sub">WEB</a>
        </div>
      </div>

      <div class="btn-container">
        <a href="final/v.mp4" target="_blank" class="btn">PRENDAS</a>
      </div>

      <div class="btn-container">
        <a href="final/p.mp4" target="_blank" class="btn">PACKAGING</a>
      </div>
    </div>
  </div>

  <footer>
    LANNA &copy; 2026
  </footer>

  <script>
    document.getElementById('btn-brief').addEventListener('click', function() {
      const dropdown = document.getElementById('dropdown-brief');
      dropdown.classList.toggle('active');
    });
  </script>

</body>
</html>
