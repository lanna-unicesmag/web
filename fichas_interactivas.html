<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=2560">
  <title>LANNA — Fichas Técnicas Interactivas</title>
  <link rel="icon" href="logo/isotipo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       LANNA DESIGN TOKENS (Quiet Luxury — Inspirado en pitch.html)
       ========================================================================== */
    :root {
      --dark: #121312;
      --stone: #1e1f1e;
      --light: #f5f0e8;
      --gold: #e5c272;
      --gold-bg: rgba(229, 194, 114, 0.08);
      --border-color: rgba(245, 240, 232, 0.1);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --fw: "Outfit", sans-serif;
      --fh: "Playfair Display", serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--dark);
      color: var(--light);
      font-family: var(--fw);
      -webkit-font-smoothing: antialiased;
    }

    /* 16:9 Screen Layout Container */
    .app-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* HEADER / TOP BAR */
    header.top-bar {
      height: 70px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      flex-shrink: 0;
      z-index: 100;
      background: rgba(18, 19, 18, 0.95);
      backdrop-filter: blur(10px);
    }

    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--light);
      padding: 0.6rem 1.2rem;
      font-family: var(--fw);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      border-radius: 2px;
      width: 100%;
    }

    .btn-back:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-bg);
      transform: translateX(-4px);
    }

    .header-logo {
      height: 20px;
      filter: brightness(0) saturate(100%) invert(86%) sepia(21%) saturate(795%) hue-rotate(345deg) brightness(97%) contrast(93%) !important;
      opacity: 1;
    }

    .btn-action-group {
      display: flex;
      gap: 0.8rem;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 0.6rem 1.2rem;
      font-family: var(--fw);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      border-radius: 2px;
    }

    .btn-action:hover {
      background: var(--gold);
      color: var(--dark);
      box-shadow: 0 0 20px rgba(229, 194, 114, 0.3);
    }

    /* MAIN CONTENT SPLIT-PANE */
    .split-pane {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* SIDEBAR SECTOR (FIJO Y ANGOSTO) */
    aside.sidebar {
      width: 260px;
      border-right: 1px solid var(--border-color);
      background: rgba(18, 19, 18, 0.65);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      overflow-y: auto;
      flex-shrink: 0;
    }

    /* Custom scrollbar for sidebar */
    aside.sidebar::-webkit-scrollbar {
      width: 4px;
    }
    aside.sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    aside.sidebar::-webkit-scrollbar-thumb {
      border-radius: 2px;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 210px;
      gap: 1rem;
    }

    /* Category Switching Tabs */
    .category-switch {
      display: flex;
      max-width: 210px;
      background: rgba(30, 31, 30, 0.8);
      border: 1px solid var(--border-color);
      padding: 0.2rem;
      margin-bottom: 1.5rem;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .switch-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--light);
      padding: 0.65rem 0;
      font-family: var(--fw);
      font-weight: 500;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      border-radius: 2px;
    }

    .switch-btn.active {
      background: var(--gold);
      color: var(--dark);
      font-weight: 700;
    }

    /* Item Groups */
    .menu-group {
      display: none;
      flex-direction: column;
      gap: 1.2rem;
    }

    .menu-group.active {
      display: flex;
    }

    .ensemble-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .section-title {
      font-family: var(--fw);
      font-weight: 700;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(229, 194, 114, 0.2) 0%, rgba(229, 194, 114, 0) 100%);
    }

    /* Grid of Selection Cards (Cuadraditos interactivos) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 100px);
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }

    .card-btn {
      position: relative;
      aspect-ratio: 1;
      border: 1px solid rgba(245, 240, 232, 0.08);
      background-size: cover;
      background-position: center;
      cursor: pointer;
      overflow: hidden;
      border-radius: 3px;
      transition: all 0.4s var(--ease);
      display: flex;
      align-items: flex-end;
      padding: 0.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(18, 19, 18, 0.95) 0%, rgba(18, 19, 18, 0.3) 100%);
      z-index: 1;
      transition: all 0.4s var(--ease);
    }

    .card-btn .card-label {
      position: relative;
      z-index: 2;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--light);
      line-height: 1.1;
      transition: all 0.3s var(--ease);
    }

    .card-btn:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(229, 194, 114, 0.15);
    }

    .card-btn:hover::before {
      background: linear-gradient(to top, rgba(18, 19, 18, 0.95) 0%, rgba(18, 19, 18, 0.15) 100%);
    }

    .card-btn.active {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(229, 194, 114, 0.25);
    }

    .card-btn.active .card-label {
      color: var(--gold);
    }

    /* FULL-BLEED VISOR PANELS (70% WIDTH - A SANGRE) */
    main.viewer {
      flex: 1;
      background: var(--dark);
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Viewer content wrapper (A sangre, 100% full height/width) */
    .viewer-content {
      width: 100%;
      height: 100%;
      display: flex;
      opacity: 0;
      transform: scale(0.99);
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
      padding: 2rem;
      gap: 2rem;
      overflow: hidden;
    }

    .viewer-content.active {
      opacity: 1;
      transform: none;
    }

    /* Viewer Left: High-end interactive gallery (42% width) */
    .viewer-gallery {
      width: 42%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex-shrink: 0;
      height: 100%;
    }

    .main-image-display {
      width: 100%;
      aspect-ratio: 1;
      flex-shrink: 0;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      transition: background-image 0.35s var(--ease);
      position: relative;
    }

    .main-image-display::after {
      content: "";
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .gallery-thumbnails {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      flex-shrink: 0;
    }

    .thumb-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      opacity: 0.6;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .thumb-btn:hover {
      opacity: 0.9;
      border-color: rgba(245, 240, 232, 0.4);
    }

    .thumb-btn.active {
      opacity: 1;
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(229, 194, 114, 0.3);
    }

    /* Viewer Right: Spec-Sheet display panel (58% width) */
    .viewer-specs {
      width: 58%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      overflow-y: auto;
      padding-right: 1rem;
      height: 100%;
    }

    /* Custom scrollbar for specs */
    .viewer-specs::-webkit-scrollbar {
      width: 4px;
    }
    .viewer-specs::-webkit-scrollbar-track {
      background: transparent;
    }
    .viewer-specs::-webkit-scrollbar-thumb {
      background: rgba(245, 240, 232, 0.15);
      border-radius: 2px;
    }

    /* Spec sheet header styling */
    .spec-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
    }

    .spec-ref {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
      display: block;
    }

    .spec-title-text {
      font-family: var(--fw);
      font-weight: 900;
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--light);
    }

    /* Grid of sleek metadata chips */
    .spec-chips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
    }

    .spec-chip {
      background: rgba(30, 31, 30, 0.5);
      border-left: 3px solid var(--gold);
      border-right: 1px solid rgba(245, 240, 232, 0.04);
      border-top: 1px solid rgba(245, 240, 232, 0.04);
      border-bottom: 1px solid rgba(245, 240, 232, 0.04);
      padding: 0.6rem 0.8rem;
      border-radius: 2px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .spec-chip-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
      display: block;
    }

    .spec-chip-value {
      font-size: 0.76rem;
      font-weight: 300;
      color: var(--light);
      line-height: 1.3;
    }

    /* Details row structure */
    .spec-section-title {
      font-family: var(--fw);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
      border-bottom: 1px solid rgba(229, 194, 114, 0.2);
      padding-bottom: 0.3rem;
    }

    .spec-description {
      font-size: 0.85rem;
      font-weight: 300;
      line-height: 1.6;
      color: rgba(245, 240, 232, 0.8);
    }

    /* Cronograma: Vertical Visual Timeline */
    .timeline-container {
      position: relative;
      padding-left: 1.5rem;
      margin: 0.4rem 0;
    }

    .timeline-container::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 6px;
      bottom: 6px;
      width: 1px;
      border-left: 1px dashed rgba(229, 194, 114, 0.3);
    }

    .timeline-step {
      position: relative;
      margin-bottom: 0.8rem;
    }
    .timeline-step:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -1.5rem;
      top: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--dark);
      box-shadow: 0 0 0 1px var(--gold);
    }

    .timeline-text {
      font-size: 0.8rem;
      font-weight: 300;
      line-height: 1.4;
      color: rgba(245, 240, 232, 0.8);
    }

    /* Components Table */
    .comp-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(30, 31, 30, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .comp-table th, .comp-table td {
      padding: 0.65rem 0.9rem;
      font-size: 0.78rem;
      text-align: left;
    }

    .comp-table th {
      background: rgba(18, 19, 18, 0.8);
      color: var(--gold);
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }

    .comp-table td {
      border-bottom: 1px solid rgba(245, 240, 232, 0.05);
      font-weight: 300;
    }
    .comp-table tr:last-child td {
      border-bottom: none;
    }

    /* Observations block: Playfair cursive overlay */
    .obs-block {
      background: var(--gold-bg);
      border-left: 2px solid var(--gold);
      padding: 1rem 1.4rem;
      border-radius: 0 4px 4px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .obs-label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 0.4rem;
      display: block;
    }

    .obs-text {
      font-family: var(--fh);
      font-style: italic;
      font-size: 0.9rem;
      line-height: 1.5;
      color: rgba(245, 240, 232, 0.9);
    }

    
    /* Botón Fullscreen */
    .fs-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--dark);
      border: 1px solid var(--gold);
      color: var(--gold);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9999;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .fs-button:hover {
      background: var(--gold);
      color: var(--dark);
      transform: scale(1.1);
    }

    /* PRINT LAYOUT (TAMAÑO CARTA VERTICAL) */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: fixed;
        left: 0;
        top: 0;
        width: 215.9mm !important;
        height: 279.4mm !important;
        padding: 10mm !important;
        background: white !important;
        color: black !important;
        box-shadow: none !important;
        z-index: 9999999;
      }
    }
  </style>
</head>
<body>

    <!-- HEADER ELIMINADO PARA MAXIMIZAR ESPACIO -->

    <div class="split-pane">
      
      <!-- SIDEBAR SECTOR (30% WIDTH) -->
      <aside class="sidebar">
        
        <!-- Category switcher tabs -->
        <div class="category-switch">

        <div class="menu-group active" id="group-prendas">

          </div>

          <div class="ensemble-section">

              </button>

      <!-- VISOR PANEL DERECHO (70% WIDTH - A SANGRE) -->

  </div>

  <!-- CONTAINER HIDDEN DE IMPRESIÓN (FORMATO CARTA VERTICAL) -->

  <!-- ==========================================================================
       DATOS COMPLETOS DE FICHAS TÉCNICAS (JSON DATABASE)
       ========================================================================== */ -->
  <script>
    const database = {
      // PRENDAS
      "g_ruana_chia": {
        nombre: "Ruana &ldquo;Chía&rdquo;",
        ref: "Colección Mitológica - Chía (La Luna) - 01",

            <div class="ft-cell w-25" style="border-right: 1px solid rgba(18, 19, 18, 0.6); text-align: center; justify-content: center; flex-direction: row; align-items: center; font-size: 8pt; padding: 2px;">
              <span class="ft-label" style="font-size: 6.5pt; font-weight: 600; margin: 0 4px 0 0; text-transform: uppercase;">Línea:</span> ${data.linea}
            </div>
            <div class="ft-cell w-25" style="border-right: 1px solid rgba(18, 19, 18, 0.6); text-align: center; justify-content: center; flex-direction: row; align-items: center; font-size: 8pt; padding: 2px;">
              <span class="ft-label" style="font-size: 6.5pt; font-weight: 600; margin: 0 4px 0 0; text-transform: uppercase;">Terminado:</span> [ X ]
            </div>
            <div class="ft-cell w-25" style="text-align: center; justify-content: center; flex-direction: row; align-items: center; font-size: 8pt; padding: 2px;">
              <span class="ft-label" style="font-size: 6.5pt; font-weight: 600; margin: 0 4px 0 0; text-transform: uppercase;">En Proceso:</span> [ &nbsp; ]
            </div>
          </div>

        </div>
      `;
    }

    // CARGAR PRIMER ELEMENTO AL INICIO
    loadSheet("g_ruana_chia");

    // INTERCONEXIÓN MINIATURAS
    window.switchMainImage = function(btn, imgUrl) {
      const thumbs = galleryThumbs.querySelectorAll(".thumb-btn");
      thumbs.forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      mainDisplayBox.style.backgroundImage = `url('${imgUrl}')`;
    };


    // LÓGICA DE PANTALLA COMPLETA
    document.addEventListener("DOMContentLoaded", () => {
      const fsBtn = document.getElementById("fullscreen-btn");
      const fsEnter = document.getElementById("fs-icon-enter");
      const fsExit = document.getElementById("fs-icon-exit");

      if (fsBtn) {
        fsBtn.addEventListener("click", () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
              console.log(`Error: ${err.message}`);
            });
          } else {
            document.exitFullscreen();
          }
        });

        document.addEventListener("fullscreenchange", () => {
          if (document.fullscreenElement) {
            fsEnter.style.display = "none";
            fsExit.style.display = "block";
          } else {
            fsEnter.style.display = "block";
            fsExit.style.display = "none";
          }
        });
      }
    });
  </script>



  <button id="fullscreen-btn" class="fs-button" title="Pantalla Completa">
    <svg id="fs-icon-enter" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
    <svg id="fs-icon-exit" style="display:none;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
  </button>
</body>
</html>
